name: supervisor_finder
description: A Flutter frontend for the Supervisor Finder app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2              # lets us make requests to the FastAPI backend
  shared_preferences: ^2.3.2 # lets us save the login token on the device

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true